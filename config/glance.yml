# ============================================================
# Shared widget definitions (YAML anchors)
# Edit once here — every page below reuses them via *alias.
# Docs: https://github.com/glanceapp/glance/blob/main/docs/configuration.md
# ============================================================
define:
  - &search
    type: search
    search-engine: duckduckgo
    bangs:
      - title: Google
        shortcut: "!g"
        url: https://www.google.com/search?q={QUERY}
      - title: YouTube
        shortcut: "!yt"
        url: https://www.youtube.com/results?search_query={QUERY}
      - title: Wikipedia
        shortcut: "!w"
        url: https://en.wikipedia.org/w/index.php?search={QUERY}

  - &clocks
    type: group
    widgets:
      - type: clock
        timezone: Asia/Kuala_Lumpur
        label: Kuala Lumpur
      - type: clock
        timezone: America/New_York
        label: New York
      - type: clock
        timezone: Europe/London
        label: London
      - type: clock
        timezone: Asia/Tokyo
        label: Tokyo

  - &weather
    type: weather
    location: Kuala Lumpur, Malaysia
    units: metric
    hour-format: 12h

  - &calendar
    type: calendar
    first-day-of-week: monday

pages:
  # ============ Malaysia ============
  - name: Malaysia
    columns:
      - size: small
        widgets:
          - *search
          - *clocks
          - *weather

      - size: full
        widgets:
          - type: group
            widgets:
              - type: rss
                title: Malaysia In Depth
                limit: 10
                collapse-after: 5
                cache: 30m
                feeds:
                  - url: "https://news.google.com/rss/search?q=site:thestar.com.my+when:2d&hl=en-MY&gl=MY&ceid=MY:en"
                    title: The Star
                    limit: 6
                  - url: https://www.malaysiakini.com/rss/en/news.rss
                    title: Malaysiakini
                    limit: 4

              - type: rss
                title: Business & Markets
                limit: 10
                collapse-after: 5
                cache: 30m
                feeds:
                  - url: "https://news.google.com/rss/search?q=site:theedgemalaysia.com+when:2d&hl=en-MY&gl=MY&ceid=MY:en"
                    title: The Edge
                    limit: 6
                  - url: "https://news.google.com/rss/headlines/section/topic/BUSINESS?hl=en-MY&gl=MY&ceid=MY:en"
                    title: Bursa & Business
                    limit: 4

          - type: rss
            title: Top Stories
            style: horizontal-cards
            limit: 12
            collapse-after: 6
            cache: 5m
            feeds:
              - url: http://image-injector:8080/feed?url=https%3A%2F%2Fnews.google.com%2Frss%2Fheadlines%2Fsection%2Ftopic%2FNATION%3Fhl%3Den-MY%26gl%3DMY%26ceid%3DMY%3Aen
                title: Nation
                limit: 8
              - url: http://image-injector:8080/feed?url=https%3A%2F%2Fnews.google.com%2Frss%3Fhl%3Den-MY%26gl%3DMY%26ceid%3DMY%3Aen
                title: Top Stories
                limit: 4

          - type: rss
            title: Google News — Top Stories
            limit: 10
            collapse-after: 5
            cache: 30m
            feeds:
              - url: https://news.google.com/rss?hl=en-US&gl=US&ceid=US:en
                title: Top Stories

      - size: small
        widgets:
          - *calendar

          - type: rss
            title: Malaysia Watch
            limit: 12
            collapse-after: 6
            cache: 10m
            single-line-titles: true
            feeds:
              - url: "https://news.google.com/rss/search?q=malaysia+parliament+OR+government+OR+politics&hl=en-MY&gl=MY&ceid=MY:en"
                title: Politics & Parliament
                limit: 6
              - url: "https://news.google.com/rss/search?q=malaysia+economy+OR+ringgit+OR+bursa+OR+budget&hl=en-MY&gl=MY&ceid=MY:en"
                title: Economy & Ringgit
                limit: 4
              - url: "https://news.google.com/rss/search?q=malaysia+court+OR+corruption+OR+trial&hl=en-MY&gl=MY&ceid=MY:en"
                title: Courts & Corruption
                limit: 2
              - url: "https://news.google.com/rss/search?q=sabah+OR+sarawak+OR+borneo&hl=en-MY&gl=MY&ceid=MY:en"
                title: Sabah & Sarawak
                limit: 2

          - type: rss
            title: Top Wires
            limit: 9
            collapse-after: 4
            cache: 15m
            single-line-titles: true
            feeds:
              - url: https://www.malaymail.com/feed/rss
                title: Malay Mail
                limit: 4
              - url: https://www.nst.com.my/feed
                title: New Straits Times
                limit: 3
              - url: https://www.freemalaysiatoday.com/feed/
                title: Free Malaysia Today
                limit: 2

